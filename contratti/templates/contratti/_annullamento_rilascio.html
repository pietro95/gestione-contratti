{% if d.annullamento_aperto %}<div class="small"><span class="stato stato-giallo">annullamento richiesto</span> da {{ d.annullamento_aperto.richiesta_da }}: {{ d.annullamento_aperto.motivazione }}</div>{% elif d.puo_chiedere_annullamento and not puo_rilasciare %}<form method="post" action="{% url 'contratti:rilascio_chiedi_annullamento' d.pk %}" class="mt-1">{% csrf_token %}<input type="text" name="motivazione" class="form-control form-control-sm d-inline-block w-auto" placeholder="Motivazione" aria-label="Motivazione dell'annullamento del rilascio di {{ d.get_tipo_display }} {{ d.numero }}" maxlength="2000" required><button type="submit" class="btn btn-sm btn-outline-secondary ms-1"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i> Chiedi l'annullamento</button></form>{% endif %}
