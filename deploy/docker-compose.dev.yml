# Sviluppo locale: docker compose -f deploy/docker-compose.dev.yml up --build
# App su http://localhost:8000. Credenziali di sviluppo, mai usate in produzione.
# Senza LDAP_SERVER_URI vale il login locale: creare un utente con
#   docker compose -f deploy/docker-compose.dev.yml exec web python manage.py createsuperuser
name: contratti-dev

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: contratti
      POSTGRES_PASSWORD: contratti
      POSTGRES_DB: contratti
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contratti"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: dev-solo-locale-non-usare-in-produzione
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://contratti:contratti@db:5432/contratti
    command: >
      sh -c "python manage.py migrate --noinput
             && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
