{% if imp.stato == "confermata" or imp.stato == "completata" %}<span class="stato stato-verde">{{ imp.get_stato_display }}</span>{% elif imp.stato == "anteprima" %}<span class="stato stato-blu">{{ imp.get_stato_display }}</span>{% elif imp.stato == "errore" %}<span class="stato stato-rosso">{{ imp.get_stato_display }}</span>{% else %}<span class="stato stato-grigio">{{ imp.get_stato_display }}</span>{% endif %}
