{% extends "base.html" %}
{% block title %}Contratti{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 m-0">Contratti</h1>
  {% if puo_modificare %}<a class="btn btn-primary btn-sm" href="{% url 'contratti:contratto_nuovo' %}">Nuovo contratto</a>{% endif %}
</div>
<form method="get" class="row g-2 mb-3" hx-get="{% url 'contratti:contratti' %}" hx-target="#tabella" hx-trigger="change, keyup changed delay:400ms from:input[name=q]" hx-push-url="true">
  <div class="col-md-3"><input type="search" name="q" value="{{ filtri.q }}" class="form-control form-control-sm" placeholder="Descrizione, OdA, CIG, RDA, fornitore"></div>
  <div class="col-auto"><select name="area" class="form-select form-select-sm"><option value="">Area</option>{% for v, t in aree %}<option value="{{ v }}" {% if filtri.area == v %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></div>
  <div class="col-auto"><select name="stato" class="form-select form-select-sm"><option value="">Stato</option>{% for v, t in stati %}<option value="{{ v }}" {% if filtri.stato == v %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></div>
  <div class="col-auto"><select name="alert" class="form-select form-select-sm"><option value="">Alert</option>{% for v, t in alert %}<option value="{{ v }}" {% if filtri.alert == v %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></div>
  <div class="col-auto"><select name="finanziamento" class="form-select form-select-sm"><option value="">Finanziamento</option>{% for v, t in finanziamenti %}<option value="{{ v }}" {% if filtri.finanziamento == v %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></div>
  <div class="col-md-2"><select name="fornitore" class="form-select form-select-sm"><option value="">Fornitore</option>{% for f in fornitori %}<option value="{{ f.pk }}" {% if filtri.fornitore == f.pk|stringformat:"s" %}selected{% endif %}>{{ f }}</option>{% endfor %}</select></div>
  <div class="col-auto"><input type="number" name="anno" value="{{ filtri.anno }}" class="form-control form-control-sm" placeholder="Anno" style="width:6rem"></div>
  <div class="col-auto form-check pt-1"><input class="form-check-input" type="checkbox" name="archiviati" value="1" id="arch" {% if filtri.archiviati %}checked{% endif %}><label class="form-check-label small" for="arch">Archiviati</label></div>
  <div class="col-auto"><button class="btn btn-sm btn-outline-primary" type="submit">Filtra</button></div>
</form>
<div id="tabella">{% include "contratti/_contratti_tabella.html" %}</div>
{% endblock %}
