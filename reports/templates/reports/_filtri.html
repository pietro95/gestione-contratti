<form method="get" class="filtri d-print-none">
  <div class="row g-3 align-items-end">
  {% for campo in form %}
    <div class="col-sm-6 col-md-4 col-xl-{% if campo.name == 'anno' or campo.name == 'livello' %}2{% else %}3{% endif %}">
      <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
      {{ campo }}
    </div>
  {% endfor %}
  {% if vista %}<input type="hidden" name="vista" value="{{ vista }}">{% endif %}
  {% if request.GET.oggi %}<input type="hidden" name="oggi" value="{{ request.GET.oggi }}">{% endif %}
  <div class="col-auto"><button class="btn btn-primary" type="submit">Aggiorna</button></div>
  </div>
</form>
{% if form.errors %}<div class="alert alert-danger">{{ form.errors }}</div>{% endif %}
